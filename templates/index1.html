<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Recommendation System</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins',sans-serif;
        }
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }
        .header {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        nav{
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 18px 8%;
            transition: background 1s;
        }
        nav .logo{
            display: flex;
            align-items: center;
            font-size: 26px;
            font-weight: 600;
            color: #0b0b0b; 
        }
        nav .logo img{
            width: 40px;
            margin-right: 10px;
        }
        nav ul li{
            display: inline-block;
            list-style: none;
            margin: 10px 20px;
        }
        nav ul li a{
            text-decoration: none;
            color: #FFF;
            font-weight: 800;
        }
        nav:hover{
            background: #fff;
        }
        nav:hover .logo{
            color: #333;
        }
        nav:hover ul li a{
            color: #333;
        }
        .content {
            margin-top: 9%;
            margin-left: 9%;
            color: #FFF;
            position: relative;
            z-index: 1;
        }
        .content h1 {
            font-size: 120px;
            font-weight: 600;
            line-height: 140px;
            font-family: Brush Script MT,cursive;
        }
        .links {
            margin-top: 30px;
        }
        .links a{
            color: #FFF;
            display: inline-block;
            text-decoration: none;
        }
        .links a:hover{
            color: blue;
        }
        .btn:hover{
            background-color: rgb(0, 195, 255);
        }
        .btn{
            border: 2px solid #fff;
            padding: 10px 35px;
            border-radius: 30px;
            margin-right: 15px;
            font-weight: 700;
        }
        .output{
            color: white;
            font-family: "cursive";
            position: relative;
            z-index: 1;
        }
        .output1{
            margin-top: 20px;
            color: white;
            display: inline-block;
            font-family: "cursive";
        }
    </style>
</head>
<body>
    <div class="header">
        <video class="bg-video" autoplay loop muted playsinline>
            <source src="static/abcd.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <nav>
            <div class="logo">
                <img src="static/img2.png" alt="">
                <span>MoodSync</span>
            </div>
            <ul>
                <li><a href="#">CONTACT</a></li>
                <li><a href="http://localhost:5000/templates/join_page">TEAM-INFO</a></li>
                <li><a href="#">SUPPORT</a></li>
            </ul>
        </nav>

        <div class="content">
            <h1 class="slide-left">Feel The Beat<br>Live The Moment....!</h1>
            <div class="links slide-left">
                <a href="http://localhost:5000/camera" class="btn">Lets Start</a>
            </div>
        </div>
        
        <div class="output">
            {% if final_output %}
                <h2 style="font-family:Bio-Rhyme">Your Emotion is {{final_output}}</h2>
                <div class="output1">
                    <a href="http://localhost:5000/songs/{{final_output}}" class="btn">Songs</a>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
